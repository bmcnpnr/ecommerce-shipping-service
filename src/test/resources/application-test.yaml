spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
outbox:
  relay:
    # The relay's native query (FOR UPDATE SKIP LOCKED) needs PostgreSQL; the *IT classes run it for real.
    enabled: false
