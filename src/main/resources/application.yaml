server:
  port: 8086
spring:
  application:
    name: shipping-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/shippingdb}
    username: ${DB_USERNAME:shippinguser}
    password: ${DB_PASSWORD:shippingpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A request waits at most 5 s for a connection (then 503), not Hikari's default 30 s.
      connection-timeout: 5000
      # pgjdbc defaults to no socket timeout: a database that stops answering (dropped packets, frozen host)
      # would hold the request thread or the Kafka consumer thread until the OS gives up, many minutes later.
      data-source-properties:
        connectTimeout: 5   # seconds
        socketTimeout: 30   # seconds a read may block; statements here take milliseconds
        tcpKeepAlive: true
  jpa:
    # No database connection or session held for the whole request; the service layer maps to DTOs inside its transactions.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.dialect: Hibernate detects it from the connection (PostgreSQL
    # here, H2 under the test profile); setting it explicitly is deprecated.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    # The only Kafka key read: Boot's Kafka auto-configuration is not on the
    # classpath (plain spring-kafka), so producer and consumer settings live in
    # config/KafkaProducerConfig.java, which reads this through @Value.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    scheduling:
      shutdown:
        # let a relay run that is mid-batch finish instead of interrupting it on SIGTERM
        await-termination: true
        await-termination-period: 20s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  # Same path as every other service: the gateway's unified Swagger UI fetches
  # /api-docs/shipping-service, which it routes to this service's /api-docs.
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    # DEBUG on demand: LOGGING_LEVEL_COM_ECOMMERCE=DEBUG
    com.ecommerce: INFO
    # Hibernate writes two WARN lines (SQLState, then the driver's message) for every failed JDBC call: with the
    # database down that is two lines per request, however busy the service is. The exception itself reaches
    # GlobalExceptionHandler and the Kafka listener, which log one throttled line naming the cause.
    org.hibernate.orm.jdbc.error: "OFF"
    # Logs "Application exception overridden by rollback exception" with a stack trace of several hundred lines for
    # every transaction that was in flight when its connection died (a killed backend, a database restart). The
    # handler reports the failure once per window, with the root cause, and answers 503.
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"

# Transactional outbox (OutboxRelay): events are written with the state change and published from here.
# outbox.relay.enabled=false switches the relay off (the H2 test profile does: its native query is Postgres-only).
# send-timeout-ms (default 35000) is the backstop above the producer's delivery.timeout.ms (30 s).
outbox:
  relay:
    enabled: true
    interval-ms: 500
    batch-size: 100
